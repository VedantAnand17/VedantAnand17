name: Generate profile cards

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: codebuild-vedantanand17-profile-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=VedantAnand17&show_icons=true&hide_border=true&theme=default&card_width=450
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=VedantAnand17&show_icons=true&hide_border=true&theme=github_dark&card_width=450
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generated for completeness but not embedded in the README; see the comment
      # next to the stats card there for why the byte-weighted numbers mislead.
      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=VedantAnand17&layout=compact&hide_border=true&langs_count=8&theme=default&card_width=450
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=VedantAnand17&layout=compact&hide_border=true&langs_count=8&theme=github_dark&card_width=450
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed cards
        run: |
          set -euo pipefail
          # A card that failed to fetch data renders a "Something went wrong" placeholder
          # instead of erroring, so reject it here rather than committing a broken profile.
          if grep -q "Something went wrong" profile/*.svg; then
            echo "::error::A generated card contains an error placeholder; refusing to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "chore: refresh profile cards"
          git push
